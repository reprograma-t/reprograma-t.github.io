<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Formulário de Oração - Templo do Afeto</title>
  <style>
    body {
      font-family: "Helvetica Neue", sans-serif;
      background: #fffaf5;
      margin: 0;
      padding: 2em;
      color: #3d2c29;
    }

    h1 {
      text-align: center;
      color: #c25c5c;
    }

    form {
      max-width: 600px;
      margin: 0 auto;
    }

    label {
      display: block;
      margin-top: 1.5em;
      font-weight: bold;
    }

    textarea, input {
      width: 100%;
      padding: 0.8em;
      border: 1px solid #d5cfcf;
      border-radius: 8px;
      font-size: 1em;
      margin-top: 0.5em;
      box-sizing: border-box;
    }

    button {
      margin-top: 2em;
      background: #c25c5c;
      color: white;
      border: none;
      padding: 1em;
      border-radius: 8px;
      font-size: 1em;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background: #a94b4b;
    }

    .audio-btn {
      margin-top: 0.3em;
      font-size: 0.9em;
      color: #444;
      background: none;
      border: none;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🙏 Formulário de Oração</h1>
  <form id="formOracao">
    
    <label for="nome">
      Qual seu nome ou como prefere ser chamado(a)?
      <button type="button" class="audio-btn" onclick="playAudio('nome')">🔊 Ouvir</button>
    </label>
    <input type="text" id="nome" required />

    <label for="sentimentos">
      O que está vivo em você neste momento?
      <button type="button" class="audio-btn" onclick="playAudio('sentimentos')">🔊 Ouvir</button>
    </label>
    <textarea id="sentimentos" rows="3" required></textarea>

    <label for="necessidades">
      Quais necessidades ou valores estão tocados em você?
      <button type="button" class="audio-btn" onclick="playAudio('necessidades')">🔊 Ouvir</button>
    </label>
    <textarea id="necessidades" rows="3" required></textarea>

    <label for="pedido">
      Qual é o seu pedido de oração?
      <button type="button" class="audio-btn" onclick="playAudio('pedido')">🔊 Ouvir</button>
    </label>
    <textarea id="pedido" rows="4" required></textarea>

    <button type="submit">✨ Enviar meu pedido pelo WhatsApp</button>
  </form>

  <script>
    function playAudio(nome) {
      new Audio(`${nome}.mp3`).play();
    }

    document.getElementById("formOracao").addEventListener("submit", function(e) {
      e.preventDefault();
      const nome = document.getElementById("nome").value;
      const sentimentos = document.getElementById("sentimentos").value;
      const necessidades = document.getElementById("necessidades").value;
      const pedido = document.getElementById("pedido").value;

      const mensagem = 
        `🙏 Pedido de Oração\n\n` +
        `🌸 Nome: ${nome}\n\n` +
        `💬 Sentimentos: ${sentimentos}\n\n` +
        `🌿 Necessidades/Valores: ${necessidades}\n\n` +
        `🕊️ Pedido de oração: ${pedido}`;

      const link = `https://wa.me/5512982467963?text=${encodeURIComponent(mensagem)}`;
      window.open(link, "_blank");
    });
  </script>
</body>
</html>
